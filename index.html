<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme/language applied before first paint; moved to a file so CSP needs no script hash (issue 003). -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default/fallback metadata for crawlers without JavaScript, used only when a page was not
         pre-rendered (scripts/prerender.mjs, issue 011). Tagged data-default-meta: main.tsx removes
         these at startup so the per-route <Seo /> tags rendered by React are the only ones.
         scripts/prerender.mjs replaces this whole block with the real, page-specific tags. -->
    <title data-default-meta>The Talent Hub | Coaching &amp; Academic Preparation in Bhusawal</title>
    <meta
      data-default-meta
      name="description"
      content="The Talent Hub in Bhusawal provides foundation and competitive examination preparation for students from Classes 6 to 12, including JEE, NEET, MHT-CET, Olympiad and Homi Bhabha preparation."
    />
    <meta data-default-meta property="og:locale" content="en_IN" />
    <meta data-default-meta property="og:image" content="/og-image.png" />
    <!-- __PRERENDERED_HEAD__ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Talent Hub" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      The Talent Hub, Bhusawal. Please enable JavaScript to view this website, or message us on WhatsApp at +91 91586
      60990.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
